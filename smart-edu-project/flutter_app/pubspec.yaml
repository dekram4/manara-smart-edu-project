name: manara_knowledge
description: منصة منارة المعرفة التعليمية - تطبيق Flutter أصلي للطلاب والمعلمين والمشرفين وأولياء الأمور.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  supabase_flutter: ^2.8.3
  just_audio: ^0.9.46
  shared_preferences: ^2.5.3
  video_player: ^2.9.3
  confetti: ^0.8.0
  pdf: ^3.11.3
  printing: ^5.14.2
  http: ^1.3.0
  flutter_tts: ^4.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900