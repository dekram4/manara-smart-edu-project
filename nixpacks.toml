providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs"]
cmds = ["npm install -g pnpm@9"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["PORT=5000 BASE_PATH=/ pnpm --filter @workspace/mockup-sandbox build"]

[start]
cmd = "pnpm --filter @workspace/mockup-sandbox dev"
