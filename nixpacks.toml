providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs"]
cmds = ["corepack enable"]

[phases.install]
cmds = ["npx pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["PORT=3000 npx pnpm --filter @workspace/mockup-sandbox build"]

[start]
cmd = "npx pnpm --filter @workspace/mockup-sandbox dev"
