providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs"]

[phases.install]
cmds = ["npx pnpm@9 install --no-frozen-lockfile"]

[phases.build]
cmds = ["PORT=5000 BASE_PATH=/ npx pnpm@9 --filter @workspace/mockup-sandbox build"]

[start]
cmd = "npx pnpm@9 --filter @workspace/mockup-sandbox preview --host 0.0.0.0 --port 5000"
