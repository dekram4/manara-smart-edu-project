providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs"]

[phases.install]
cmds = ["npx pnpm@9 install --no-frozen-lockfile"]

[phases.build]
cmds = ["PORT=5000 BASE_PATH=/ npx pnpm@9 --filter @workspace/mockup-sandbox build"]

[start]
cmd = "npx --yes serve -s artifacts/mockup-sandbox/dist -l 5000"
