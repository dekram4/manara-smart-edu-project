# بناءُ Railway (Nixpacks) — والتشغيلُ وفحصُ الصحة في railway.json.
#
# pnpm عبر npx بإصدارٍ مثبّت، في كلِّ أمر: صورةُ Nixpacks تبني PATH من حزم Nix،
# فـ pnpm المثبَّتُ عامّاً (npm -g، ولو في /usr/local) لا يُوجد في السطر الذي يليه.
# و npx يجده دائماً — وبه نجح التثبيت. والتشغيلُ node وحده، فلا يحتاج pnpm.
#
# والإصدارُ الذي يختاره Railway تلقائياً قد يقرأ إعداداتِ المستودع (overrides في
# pnpm-workspace.yaml) بغير ما كُتب به ملفُّ القفل، فيرفض التثبيتَ المجمَّد بـ
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. ولذا أيضاً --no-frozen-lockfile.
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npx --yes pnpm@10.34.5 install --no-frozen-lockfile"]

# الواجهةُ (artifacts/manara) ثم الخادم — والخادمُ يقدّمها على عنوانه.
# (railway.json يحمل الأمرَ نفسه، فيتقدّم على أيِّ أمرٍ محفوظٍ في لوحة Railway.)
[phases.build]
cmds = [
  "npx --yes pnpm@10.34.5 --filter @workspace/manara run build",
  "npx --yes pnpm@10.34.5 --filter @workspace/api-server run build",
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
