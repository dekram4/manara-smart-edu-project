providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs"]
cmds = ["corepack enable"]

[phases.install]
cmds = ["npx pnpm install --no-frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = ["PORT=5000 BASE_PATH=/ npx pnpm --filter @workspace/mockup-sandbox build"]

[start]
cmd = "npx pnpm --filter @workspace/mockup-sandbox dev"
