plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.manara_student"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.manara_student"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // مضبوطٌ صراحةً لا متروكاً لفلاتر.
        //
        // `flutter_tts` يطلب 24، و`flutter.minSdkVersion` قد يكون أقلّ
        // بحسب نسخة الأداة — فيسقط دمجُ المانيفست برسالةٍ عن `uses-sdk`
        // لا تدلّ على أيّ إضافةٍ طلبت ماذا. وتثبيتُه هنا يجعل الشرط
        // مكتوباً حيث يُقرأ، ولا يتغيّر بتغيّر أداة البناء.
        //
        // و24 هو أندرويد 7.0: يغطّي ما يزيد على ثمانيةٍ وتسعين بالمئة
        // من الأجهزة العاملة، والباقي أقدم من أن يشغّل هذا التطبيق.
        minSdk = Math.max(24, flutter.minSdkVersion)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
