// مفتاحُ توقيع الإصدار: يُقرأ من android/key.properties (لا يُرفع إلى المستودع).
// في GitHub Actions يكتبه سيرُ العمل من الأسرار؛ وعلى جهاز المطوّر يضعه هو.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.manara.student"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // المعرّفُ النهائيّ في المتاجر — لا يتغيّر بعد أوّل نشر: تغييرُه
        // يجعل التطبيقَ تطبيقاً آخر لا تحديثاً.
        applicationId = "com.manara.student"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // مضبوطٌ صراحةً لا متروكاً لفلاتر.
        //
        // `flutter_tts` يطلب 24، و`flutter.minSdkVersion` قد يكون أقلّ
        // بحسب نسخة الأداة — فيسقط دمجُ المانيفست برسالةٍ عن `uses-sdk`
        // لا تدلّ على أيّ إضافةٍ طلبت ماذا. وتثبيتُه هنا يجعل الشرط
        // مكتوباً حيث يُقرأ، ولا يتغيّر بتغيّر أداة البناء.
        //
        // و24 هو أندرويد 7.0: يغطّي ما يزيد على ثمانيةٍ وتسعين بالمئة
        // من الأجهزة العاملة، والباقي أقدم من أن يشغّل هذا التطبيق.
        minSdk = Math.max(24, flutter.minSdkVersion)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // بمفتاح الإصدار حين يوجد. وبدونه (تجربةٌ محليّة) يُوقَّع بمفتاح
            // التطوير — وسيرُ عمل GitHub يرفض البناء أصلاً إن غاب المفتاح،
            // فلا يُنشر APK بمفتاح التطوير.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
