allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Flutter plugins may each request a different Android Gradle Plugin/Kotlin
// toolchain. The app's versions in settings.gradle are compatible with this
// project, so reuse them for every plugin instead of downloading duplicates.
gradle.beforeProject { pluginProject ->
    pluginProject.buildscript.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == "com.android.tools.build" &&
                    dependency.requested.name == "gradle") {
                dependency.useVersion("8.1.0")
            }
            if (dependency.requested.group == "org.jetbrains.kotlin" &&
                    dependency.requested.name == "kotlin-gradle-plugin") {
                dependency.useVersion("1.8.22")
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
