name: manara_student
description: تطبيق منارة المعرفة المخصص للطلاب.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material and Cupertino's own translations for Arabic and English —
  # month names, dialog buttons, accessibility labels. Without it the
  # framework's own widgets stay English whatever the app's language is.
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  shared_preferences: ^2.3.3
  flutter_inappwebview: ^6.1.5
  # media_kit is kept for Windows only now — Android/iOS/iPadOS MP4 playback
  # goes exclusively through video_player (see student_video_player.dart's
  # `_usesMediaKit`), so media_kit_libs_android_video is intentionally not
  # a dependency here: it would just ship the native libmpv binaries behind
  # the documented Android Surface/TextureView attach bug without anything
  # in the app ever using them.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: 1.0.9
  google_fonts: ^8.2.1
  crypto: ^3.0.6
  # ساعةٌ تُزيَّف في الاختبار: عدّادُ سؤال المبارزة يُقرأ منها، فيُختبر بلا انتظار.
  clock: ^1.1.2
  http: ^1.2.2
  video_player: 2.10.0
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
  video_thumbnail: ^0.5.6
  # Asks for the microphone before the virtual teacher's page does. The
  # WebView grants its own getUserMedia request happily, but on Android
  # that only succeeds if the app already holds RECORD_AUDIO — otherwise
  # the capture fails inside the page and the teacher silently drops to
  # text, or asks the child to open a browser instead.
  #
  # Held at 11.x deliberately. 13.x pulls permission_handler_android 14,
  # which builds against compileSdk 37 and Java 17; this app compiles at
  # Java 8 on Flutter's compileSdk 36, so that combination fails the APK
  # build outright. 11.x resolves to permission_handler_android 12.1.0 —
  # compileSdk 34, Java 8, minSdk 19 — which is inside what this app
  # already targets. Raise this only together with the Java level in
  # android/app/build.gradle.
  permission_handler: ^11.3.1

  # ── الصوت والكاميرا في بطاقة حل المسائل ──
  #
  # `speech_to_text` يحوّل كلام الطفل إلى نصّ على الجهاز نفسه: لا يُرفع
  # صوته إلى خدمةٍ ولا يُكلّف استدعاءً، والنصّ الخارج يمرّ بالذاكرة قبل
  # النموذج كأي سؤالٍ مكتوب.
  speech_to_text: ^7.0.0

  # و`flutter_tts` ينطق الإجابة بمحرّك النظام — مجّاناً وبلا شبكة.
  flutter_tts: ^4.2.0

  # `image_picker` للتقاط صورة المسألة أو اختيارها.
  #
  # ولا محرّك تعرّفٍ ضوئيّ معه: `google_mlkit_text_recognition` يضيف
  # عشرات الميغابايتات إلى الـ APK ويجرّ تبعيات Play Services، وهو أثقل
  # ما يمكن أن يُدخَل على بناءٍ يجب أن يبقى أخضر. والصورة تُرسل إلى
  # نموذج الرؤية في Gemini بدلاً منه — وهو ما يقرأ خطّ اليد أصلاً خيرٌ
  # من قارئٍ محليّ، ونتيجتُه تُحفظ في الذاكرة فلا تُدفع كلفتُها مرّتين.
  image_picker: ^1.1.2

  # ── تسجيلُ الرسائل الصوتية في المبارزة الحيّة ──
  #
  # `record` يسجّل مقطعاً قصيراً بترميز AAC وبمعدّل بتٍّ نختاره. والمعدّلُ
  # المنخفض شرطٌ لا تحسين: المقطعُ يُبثّ عبر قناة المباراة، وقناةُ Realtime
  # لها سقفُ حجمٍ للرسالة — فمقطعٌ بجودة الموسيقى لا يصل أصلاً.
  #
  # ولا `flutter_sound` مكانه: يجرّ مكتباتٍ أصليّةً تزيد الـ APK عشراتَ
  # الميغابايتات، وهذا بناءٌ يجب أن يبقى أخضر وخفيفاً على جهاز طفل.
  #
  record: ^5.1.2

# ── تجاوزٌ واحد، وسببُه بناءٌ سقط ──
#
# `record: ^5.1.2` يحلّ إلى `record 5.2.1`، وقيدُه على حزمة لينكس
# `record_linux: ^0.7.1` فيحلّ إلى 0.7.2. لكنّ `record_platform_interface`
# يحلّ إلى 1.6.0 — و0.7.2 لا يُنفّذ تلك الواجهة: ينقصه أعضاءٌ، ولدالّةٍ فيه
# معاملاتٌ أقلّ من المنقوضة.
#
# ── وسقط بها بناءُ أندرويد لا لينكس ──
# مُترجِمُ Dart يقرأ حزمَ المنصّات كلَّها لا حزمةَ المنصّة المبنيّة وحدها، فخطأُ
# ترجمةٍ في حزمةِ لينكس يُسقط بناءَ APK.
#
# وهذا عطبٌ لا يمسكه شيءٌ ممّا نُشغّله: `flutter pub get` مرّ، و`analyze` مرّ،
# و٤٥٥ اختباراً مرّت — ويظهر في بناء APK وحده. ولذلك يُكتب هنا لا يُصلَح
# بصمتٍ: من يرفع `record` لاحقاً يحتاج أن يعرف أنّ القيدَ المنشور مكسور.
#
# و`record_linux 1.3.1` يُنفّذ `^1.5.0` من الواجهة، وهو ما حُلّ إليه.
dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # Imported directly by test/settings_and_strings_test.dart.
  collection: ^1.19.1

  # ── تُستورَدان في `test/voice_recorder_deps_test.dart` بقصد ──
  # ذاك الاختبارُ يُدخل حزمةَ منصّةِ التسجيل في شجرة الترجمة ليُمسك عدمَ
  # تطابقها مع واجهةِ المنصّة — عطبٌ أسقط بناءَ APK مرّةً ولم يمسكه شيءٌ آخر.
  #
  # و`any` مقصودة: الاختبارُ يريد ما حلّ إليه التطبيقُ فعلاً، لا نسخةً يختارها
  # هو. وقيدٌ ثابتٌ هنا كان سيخفي الافتراقَ الذي جُعل ليُمسكه.
  record_linux: any
  record_platform_interface: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/audio/
    # The recorded line each portal says when opened. Listed on its own
    # because a directory entry above does not include its subdirectories.
    # Generated by tool/build_portal_voices.py.
    - assets/audio/voice/

# The launcher icon: the two reading children from the login screen holding
# the Manara mark from the welcome screen, so what a child taps on the home
# screen is the same pair that greets them inside it.
#
# The icon is composed from those two assets by `tool/build_launcher_icon.py`
# — re-run it there rather than editing the PNGs, so the composition stays
# derived from the artwork the app actually ships.
#
# `assets/icon/` is NOT in the `assets:` list above, and must not be added to
# it. These are build-time inputs that nothing at runtime ever draws, and while
# the previous pair sat under the declared assets/images/ directory every copy
# of the app carried ~1.5 MB of artwork it could not use. What ships is the
# generated output under android/app/src/main/res.
#
# Regenerate with `dart run flutter_launcher_icons` after changing either
# image; that output is committed, so the APK build does not run this
# step itself.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  # This project has no ios/ runner — only android, web and windows — so
  # there is no Assets.xcassets to write into and the generator fails
  # outright on `ios: true`. Everything else here is already correct for
  # iOS and iPadOS: add the platform with
  # `flutter create --platforms=ios .`, flip this to true, and re-run
  # `dart run flutter_launcher_icons`. `remove_alpha_ios` is kept ready
  # because the App Store rejects icons with an alpha channel.
  ios: false
  remove_alpha_ios: true
  # No adaptive icon: no adaptive_icon_background, no foreground layer.
  # An adaptive icon always has a background layer — a colour draws a square
  # behind the characters, and a transparent one was filled with black by
  # tablet and Samsung launchers. The plain transparent image above is the
  # whole icon: the two characters and the mark, nothing behind them.
