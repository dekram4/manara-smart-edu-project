name: manara_student
description: تطبيق منارة المعرفة المخصص للطلاب.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_animate: ^4.5.2
  rive: ^0.13.20
  lottie: ^3.2.0
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  shared_preferences: ^2.3.3
  flame: ^1.24.0
  flame_audio: ^2.10.6
  flutter_inappwebview: ^6.1.5
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.9
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  http: ^1.2.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/manara-logo-mark-transparent.png
    - assets/images/manara-student-login-companion-cutout.png
    - assets/animations/
    - assets/sounds/
    - assets/audio/
