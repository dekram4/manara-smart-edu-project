name: manara_student
description: تطبيق منارة المعرفة المخصص للطلاب.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material and Cupertino's own translations for Arabic and English —
  # month names, dialog buttons, accessibility labels. Without it the
  # framework's own widgets stay English whatever the app's language is.
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  shared_preferences: ^2.3.3
  flutter_inappwebview: ^6.1.5
  # media_kit is kept for Windows only now — Android/iOS/iPadOS MP4 playback
  # goes exclusively through video_player (see student_video_player.dart's
  # `_usesMediaKit`), so media_kit_libs_android_video is intentionally not
  # a dependency here: it would just ship the native libmpv binaries behind
  # the documented Android Surface/TextureView attach bug without anything
  # in the app ever using them.
  media_kit: 1.1.11
  media_kit_video: 1.2.4
  media_kit_libs_windows_video: 1.0.9
  google_fonts: ^8.2.1
  crypto: ^3.0.6
  http: ^1.2.2
  video_player: 2.10.0
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
  video_thumbnail: ^0.5.6
  # Asks for the microphone before the virtual teacher's page does. The
  # WebView grants its own getUserMedia request happily, but on Android
  # that only succeeds if the app already holds RECORD_AUDIO — otherwise
  # the capture fails inside the page and the teacher silently drops to
  # text, or asks the child to open a browser instead.
  #
  # Held at 11.x deliberately. 13.x pulls permission_handler_android 14,
  # which builds against compileSdk 37 and Java 17; this app compiles at
  # Java 8 on Flutter's compileSdk 36, so that combination fails the APK
  # build outright. 11.x resolves to permission_handler_android 12.1.0 —
  # compileSdk 34, Java 8, minSdk 19 — which is inside what this app
  # already targets. Raise this only together with the Java level in
  # android/app/build.gradle.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/audio/
    # The recorded line each portal says when opened. Listed on its own
    # because a directory entry above does not include its subdirectories.
    # Generated by tool/build_portal_voices.py.
    - assets/audio/voice/

# The launcher icon: the two reading children from the login screen holding
# the Manara mark from the welcome screen, so what a child taps on the home
# screen is the same pair that greets them inside it.
#
# Both files are composed from those two assets by `tool/build_launcher_icon.py`
# — re-run it there rather than editing the PNGs, so the composition stays
# derived from the artwork the app actually ships.
#
# `assets/icon/` is NOT in the `assets:` list above, and must not be added to
# it. These are build-time inputs that nothing at runtime ever draws, and while
# the previous pair sat under the declared assets/images/ directory every copy
# of the app carried ~1.5 MB of artwork it could not use. What ships is the
# generated output under android/app/src/main/res.
#
# Regenerate with `dart run flutter_launcher_icons` after changing either
# image; that output is committed, so the APK build does not run this
# step itself.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  # This project has no ios/ runner — only android, web and windows — so
  # there is no Assets.xcassets to write into and the generator fails
  # outright on `ios: true`. Everything else here is already correct for
  # iOS and iPadOS: add the platform with
  # `flutter create --platforms=ios .`, flip this to true, and re-run
  # `dart run flutter_launcher_icons`. `remove_alpha_ios` is kept ready
  # because the App Store rejects icons with an alpha channel.
  ios: false
  remove_alpha_ios: true
  # Android 8+ draws the foreground on its own background and then applies
  # the launcher's mask — a circle, a squircle, a rounded square. Each of
  # those contains the 72dp circle in the middle of the 108dp canvas, and the
  # foreground image keeps the whole silhouette inside it, so no launcher
  # shape clips the characters or the mark.
  # Fully transparent: no blue square, no frame. The characters and the mark
  # are the icon's whole shape, as they are in the legacy icon. The launcher
  # still clips with its mask, but a mask over transparency draws no edge.
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The generator's default is a 16% inset on every side, on top of the
  # margin the foreground image already has — that double margin is what kept
  # the characters small. The image is sized for the launcher's safe circle
  # itself (see tool/build_launcher_icon.py), so nothing is added here.
  adaptive_icon_foreground_inset: 0
