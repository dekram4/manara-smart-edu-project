name: Build Student APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'

      - name: Configure Kotlin 2.2.0 & Enforce Resolution
        run: |
          # 1. تحديث كافة إشارات Kotlin في ملفات المشروع إلى 2.2.0
          find android -name "*.gradle" -exec sed -i 's/1\.[0-9]\+\.[0-9]\+/2.2.0/g' {} +
          find android -name "*.gradle" -exec sed -i 's/2\.[0-1]\+\.[0-9]\+/2.2.0/g' {} +
          find android -name "*.gradle" -exec sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.2.0"/' {} +
          
          # 2. إجبار Gradle على توهيد نسخة Kotlin Stdlib لكافة التبعيات (Resolution Strategy)
          mkdir -p android/app
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0'
                      force 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
                  }
              }
          }
          EOF
        working-directory: artifacts/manara-student-flutter

      - name: Install Dependencies
        run: flutter pub get
        working-directory: artifacts/manara-student-flutter

      - name: Build APK
        run: flutter build apk --release --extra-front-end-options="-Xskip-metadata-version-check"
        working-directory: artifacts/manara-student-flutter

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: artifacts/manara-student-flutter/build/app/outputs/flutter-apk/app-release.apk
