name: Build Student APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'

      - name: Fix Kotlin Version Direct
        run: |
          # 1. تحديث ext.kotlin_version في build.gradle الرئيسي إن وجد
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/' android/build.gradle
          fi

          # 2. تحديث إضافة org.jetbrains.kotlin.android في settings.gradle أو build.gradle
          find android -name "*.gradle" -exec sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.0"/g' {} +
          find android -name "*.gradle" -exec sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.0.0'/g" {} +
          find android -name "*.gradle" -exec sed -i 's/kotlin-gradle-plugin:[^"]*/kotlin-gradle-plugin:2.0.0/g' {} +
        working-directory: artifacts/manara-student-flutter

      - name: Install Dependencies
        run: flutter pub get
        working-directory: artifacts/manara-student-flutter

      - name: Build APK
        run: flutter build apk --release
        working-directory: artifacts/manara-student-flutter

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: artifacts/manara-student-flutter/build/app/outputs/flutter-apk/app-release.apk
