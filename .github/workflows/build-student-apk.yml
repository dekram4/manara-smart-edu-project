name: Build Student APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ‏نشرُ الإصدار يحتاج الكتابة على المستودع (gh release).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action below is on a major that runs on Node 24 natively.
      # The previous set targeted Node 20, which GitHub has deprecated and
      # was already force-running on 24 while warning on every build — a
      # warning today, a failed build once the shim is withdrawn.
      - uses: actions/checkout@v5

      - name: Set up Java
        # v4 is out of support and stopped receiving updates; v5 is the
        # first major on Node 24.
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # youtube_player_iframe >=6.0 (added for reliable YouTube playback)
          # requires Flutter >=3.38.0 / Dart SDK ^3.10.0. Bumped from 3.27.2,
          # which can no longer resolve this app's dependencies at all.
          flutter-version: '3.44.8'

      - name: Fix Kotlin Gradle Plugin Version
        run: |
          # 1. تحديث Kotlin Gradle Plugin مباشرة داخل settings.gradle (مخصص لمشاريع Flutter الحديثة)
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          fi

          # 2. تحديث ext.kotlin_version في حال وجود ملف build.gradle قديم
          if [ -f android/build.gradle ]; then
            sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "2.1.0"/' android/build.gradle
            sed -i -E 's/kotlin-gradle-plugin:[0-9\.]+/kotlin-gradle-plugin:2.1.0/' android/build.gradle
          fi

          # 3. إجبار كافة التبعيات على توحيد نسخة Kotlin Stdlib
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
                      force 'org.jetbrains.kotlin:kotlin-reflect:2.1.0'
                  }
              }
          }
          EOF
        working-directory: artifacts/manara-student-flutter

      - name: Install Dependencies
        run: flutter pub get
        working-directory: artifacts/manara-student-flutter

      - name: Restore release signing key
        # مفتاحُ الإصدار من أسرار المستودع إلى android/key.properties. وغيابُه
        # يُسقط البناء: APK بمفتاح التطوير لا يُقبل في المتاجر، ونشرُه ثم
        # التحوّلُ عنه يجبر كلَّ طالبٍ على حذف التطبيق قبل التحديث.
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
             || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::أسرار التوقيع ANDROID_KEYSTORE_* غير مضبوطة — لا يُبنى APK بمفتاح التطوير."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/manara-release.jks
          {
            echo "storeFile=manara-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
        working-directory: artifacts/manara-student-flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK
        # المفاتيح تُحقن عند البناء من أسرار المستودع، ولم تعد مكتوبة في
        # الشيفرة كقيم افتراضية — المستودع عام، فكل قيمة افتراضية فيه منشورة.
        #
        # وإن غاب أي سرّ، يُبنى التطبيق ويعرض شاشة «الإعدادات ناقصة» بدل أن
        # ينهار: `SupabaseConfig.isConfigured` تتكفّل بذلك.
        run: |
          set -euo pipefail

          # السرّ الغائب يجب أن يُترك غير مُعرَّف، لا أن يُمرَّر فارغاً:
          # `String.fromEnvironment` تُرجع القيمة الافتراضية فقط إن لم يكن
          # المفتاح مُعرَّفاً أصلاً. تمريره فارغاً يُعرِّفه بالفراغ فيُلغي
          # الافتراضي — وهو ما كان يمحو عنوان API_BASE_URL بصمت فيقطع
          # المحادثة وGemini.
          # `if` لا `&&`: تحت `set -e` يُنهي الاختبارُ الفاشل في آخر السطر
          # السكريبتَ كلَّه، وهي بالضبط حالة السرّ الغائب التي جاء يعالجها.
          args=()
          if [ -n "${SUPABASE_URL:-}" ]; then
            args+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            args+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          if [ -n "${API_BASE_URL:-}" ]; then
            args+=("--dart-define=API_BASE_URL=$API_BASE_URL")
          fi

          # وإن غاب العنوان أو المفتاح فالبناء ينجح لكن التطبيق يفتح على
          # شاشة «الإعدادات ناقصة». نُعلن ذلك بوضوح في السجل بدل أن يُكتشف
          # على الهاتف.
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::SUPABASE_URL أو SUPABASE_ANON_KEY غير مضبوط في أسرار المستودع — سيُبنى تطبيق بلا اتصال بقاعدة البيانات."
          fi

          flutter build apk --release "${args[@]}"
        working-directory: artifacts/manara-student-flutter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Verify release signature
        # يتأكّد أن الملفّ موقَّعٌ بمفتاح الإصدار لا بمفتاح التطوير، وأن
        # معرّفه النهائيّ com.manara.student — قبل أن يُرفع.
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT2=$(find "$SDK/build-tools" -name aapt2 -type f | sort -V | tail -1)
          echo "apksigner: $SIGNER"
          echo "aapt2: $AAPT2"
          CERT=$("$SIGNER" verify --print-certs "$APK")
          echo "$CERT" | grep -E "certificate DN|SHA-256 digest"
          if echo "$CERT" | grep -q "CN=Android Debug"; then
            echo "::error::الملفّ موقَّعٌ بمفتاح التطوير."
            exit 1
          fi
          PACKAGE=$("$AAPT2" dump packagename "$APK")
          echo "package: $PACKAGE"
          if [ "$PACKAGE" != "com.manara.student" ]; then
            echo "::error::معرّف التطبيق ليس com.manara.student."
            exit 1
          fi
          rm -f android/key.properties android/app/manara-release.jks
        working-directory: artifacts/manara-student-flutter

      - name: Upload APK Artifact
        # v6 rather than v5: v5 is still a Node 20 action, so it would have
        # left the deprecation warning in place on its own.
        uses: actions/upload-artifact@v6
        with:
          name: student-apk
          path: artifacts/manara-student-flutter/build/app/outputs/flutter-apk/app-release.apk

      # ‏── رابطُ التحميل يتبع آخرَ بناء ──
      # ‏لوحةُ المشرف تشير إلى releases/latest/download/manara-student.apk.
      # ‏وكان البناءُ يرفع ملفّاً مؤقتاً (artifact) وحده، والإصدارُ يُنشأ يدوياً —
      # ‏فبقي الرابطُ على v1.1.1 بعد ثلاثة إصدارات، والطلابُ على تطبيقٍ قديم.
      # ‏فكلُّ دفعٍ إلى main يُنشئ إصدار v<نسخة pubspec> بملفّه، أو يستبدل
      # ‏ملفَّ الإصدار إن كانت النسخةُ لم تتغيّر.
      - name: Publish release for the download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' artifacts/manara-student-flutter/pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          TAG="v$VERSION"
          cp artifacts/manara-student-flutter/build/app/outputs/flutter-apk/app-release.apk manara-student.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" manara-student.apk --clobber
          else
            gh release create "$TAG" manara-student.apk \
              --title "تطبيق الطالب $TAG" \
              --notes "بناءٌ تلقائي من ${GITHUB_SHA::7}." \
              --latest
          fi
