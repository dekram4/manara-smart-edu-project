name: Build Student APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'

      - name: Force Upgrade Kotlin Version
        run: |
          # التحديث التلقائي لإصدار كوتلن في ملفات build.gradle / settings.gradle
          find android -name "build.gradle" -o -name "settings.gradle" | xargs sed -i 's/1.8.0/2.0.0/g' || true
          find android -name "build.gradle" -o -name "settings.gradle" | xargs sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/g' || true
        working-directory: artifacts/manara-student-flutter

      - name: Install Dependencies
        run: flutter pub get
        working-directory: artifacts/manara-student-flutter

      - name: Build APK
        run: flutter build apk --release
        working-directory: artifacts/manara-student-flutter

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: artifacts/manara-student-flutter/build/app/outputs/flutter-apk/app-release.apk
