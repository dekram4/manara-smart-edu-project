name: Build Student APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'

      - name: Direct Fix Kotlin & Dependencies
        run: |
          # 1. التعديل المباشر والشامل لنسخة Kotlin في كافة ملفات الأندرويد
          find android/ -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1.8.0/2.1.0/g' {} +
          find android/ -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.1.0"/' {} +

          # 2. إجبار Gradle على مطابقة النسخ لـ Kotlin 2.1.0
          if [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
                      force 'org.jetbrains.kotlin:kotlin-reflect:2.1.0'
                  }
              }
          }
          EOF
          fi

          # 3. حل مشكلة package_info_plus بإلزام pub_cache باستعمال نسخة متوافقة
          sed -i 's/package_info_plus: .*/package_info_plus: 8.0.0/g' pubspec.yaml || true
        working-directory: artifacts/manara-student-flutter

      - name: Install Dependencies
        run: flutter pub get
        working-directory: artifacts/manara-student-flutter

      - name: Build APK
        run: flutter build apk --release
        working-directory: artifacts/manara-student-flutter

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: artifacts/manara-student-flutter/build/app/outputs/flutter-apk/app-release.apk
